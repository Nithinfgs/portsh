name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/gen-rules-doc.js --check
      - name: Dogfood
        run: node bin/portsh.js . --fail-on warn

  verify:
    name: verify rules on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node bin/portsh.js verify

  verify-alpine:
    name: verify rules on Alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run portsh verify inside alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -c 'apk add --no-cache nodejs bash >/dev/null && node bin/portsh.js verify'
