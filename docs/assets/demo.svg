<svg xmlns="http://www.w3.org/2000/svg" width="980" height="644" viewBox="0 0 980 644" role="img" aria-label="portsh output: portability problems found for a short example script">
<rect width="980" height="644" rx="10" fill="#0d1117"/>
<circle cx="26" cy="26" r="6" fill="#ff5f56"/><circle cx="46" cy="26" r="6" fill="#ffbd2e"/><circle cx="66" cy="26" r="6" fill="#27c93f"/>
<text x="90" y="30" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">$ npx portsh setup.sh</text>
<g fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13">
<text x="20" y="68" xml:space="preserve"><tspan style="font-weight:700">portsh 0.1.0</tspan><tspan style="opacity:.6"> · checking for macOS, Linux</tspan></text>
<text x="20" y="87" xml:space="preserve"></text>
<text x="20" y="106" xml:space="preserve"><tspan style="fill:#ff7b72">✗</tspan> <tspan style="fill:#79c0ff">setup.sh:5:8</tspan>  <tspan style="font-weight:700">cmd-nproc</tspan>  <tspan style="fill:#ff7b72">breaks on macOS</tspan></text>
<text x="20" y="125" xml:space="preserve">    <tspan style="opacity:.6">JOBS=$(nproc)</tspan></text>
<text x="20" y="144" xml:space="preserve">           <tspan style="fill:#ff7b72">^^^^^</tspan></text>
<text x="20" y="163" xml:space="preserve">    `nproc` is not installed by default on macOS</text>
<text x="20" y="182" xml:space="preserve">    <tspan style="fill:#7ee787">fix:</tspan> Use `getconf _NPROCESSORS_ONLN`, which exists on macOS, Linux and Alpine.</text>
<text x="20" y="201" xml:space="preserve"></text>
<text x="20" y="220" xml:space="preserve"><tspan style="fill:#ff7b72">✗</tspan> <tspan style="fill:#79c0ff">setup.sh:6:11</tspan>  <tspan style="font-weight:700">grep-perl-regexp</tspan>  <tspan style="fill:#ff7b72">breaks on macOS</tspan></text>
<text x="20" y="239" xml:space="preserve">    <tspan style="opacity:.6">VERSION=$(grep -oP 'version = "\K[^"]+' Cargo.toml)</tspan></text>
<text x="20" y="258" xml:space="preserve">              <tspan style="fill:#ff7b72">^^^^</tspan></text>
<text x="20" y="277" xml:space="preserve">    `grep -P` is not available in BSD or BusyBox grep</text>
<text x="20" y="296" xml:space="preserve">    <tspan style="fill:#7ee787">fix:</tspan> Use `grep -E` with POSIX classes, or `sed -n "s/.../\1/p"`. For lookaround use `perl -ne` or `awk`.</text>
<text x="20" y="315" xml:space="preserve"></text>
<text x="20" y="334" xml:space="preserve"><tspan style="fill:#ff7b72">✗</tspan> <tspan style="fill:#79c0ff">setup.sh:7:1</tspan>  <tspan style="font-weight:700">sed-inplace-no-suffix</tspan>  <tspan style="fill:#ff7b72">breaks on macOS</tspan></text>
<text x="20" y="353" xml:space="preserve">    <tspan style="opacity:.6">sed -i "s/__VERSION__/$VERSION/" config/app.conf</tspan></text>
<text x="20" y="372" xml:space="preserve">    <tspan style="fill:#ff7b72">^^^</tspan></text>
<text x="20" y="391" xml:space="preserve">    `sed -i` needs an attached suffix to work on both GNU and BSD sed</text>
<text x="20" y="410" xml:space="preserve">    <tspan style="fill:#7ee787">fix:</tspan> Attach a suffix and remove the backup: `sed -i.bak ... file &amp;&amp; rm -f file.bak` works everywhere.</text>
<text x="20" y="429" xml:space="preserve"></text>
<text x="20" y="448" xml:space="preserve"><tspan style="fill:#ff7b72">✗</tspan> <tspan style="fill:#79c0ff">setup.sh:8:1</tspan>  <tspan style="font-weight:700">find-gnu-primaries</tspan>  <tspan style="fill:#ff7b72">breaks on macOS</tspan></text>
<text x="20" y="467" xml:space="preserve">    <tspan style="opacity:.6">find dist -name '*.tgz' -printf '%f\n' &gt; manifest.txt</tspan></text>
<text x="20" y="486" xml:space="preserve">    <tspan style="fill:#ff7b72">^^^^</tspan></text>
<text x="20" y="505" xml:space="preserve">    `find -printf` is GNU-only</text>
<text x="20" y="524" xml:space="preserve">    <tspan style="fill:#7ee787">fix:</tspan> Use `-exec basename {} \;` / `-exec stat ... {} +` instead of `-printf`, and `-perm` instead of `-executable`.</text>
<text x="20" y="543" xml:space="preserve"></text>
<text x="20" y="562" xml:space="preserve"><tspan style="font-weight:700">4 problems</tspan> in 1 of 1 file<tspan style="opacity:.6"> (4 errors, 0 warnings)</tspan></text>
<text x="20" y="581" xml:space="preserve"></text>
<text x="20" y="600" xml:space="preserve">  <tspan style="fill:#ff7b72">✗</tspan> macOS   4 problems</text>
<text x="20" y="619" xml:space="preserve">  <tspan style="fill:#7ee787">✓</tspan> Linux   clean</text>
</g>
</svg>
